<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>jQuery Mobile JSON Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- jQuery -->
	<link rel="shortcut icon" href="../favicon.ico">
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Open+Sans:300,400,700">
	<link rel="stylesheet" href="../css/themes/default/jquery.mobile-1.4.5.min.css">
	<link rel="stylesheet" href="../_assets/css/jqm-demos.css">
	<script src="../js/jquery.js"></script>
	<script src="../_assets/js/index.js"></script>
	<script src="../js/jquery.mobile-1.4.5.min.js"></script>

    <script>
    $(document).on("pagecontainershow", function () {

        var $menu = $("#menuList");

        // Prevent loading twice
        if ($menu.data("loaded")) return;

        $.ajax({
            url: "/menu3.json",   // <-- ROOT JSON FILE
            method: "GET",
            dataType: "json",
            success: function (data) {

                buildMenu(data, $menu);

                // Refresh jQuery Mobile components
                $menu.listview().listview("refresh");
                $("#mainPanel").trigger("create");

                $menu.data("loaded", true);

                console.log("Menu loaded from /menu.json");

            },
            error: function (xhr) {
                console.log("Error loading /menu.json");
                console.log(xhr.status, xhr.statusText);
            }
        });

    });


    function buildMenu(items, container) {

        $.each(items, function (i, item) {

            // Collapsible item
            if (item.children && item.children.length) {

                var li = $("<li data-role='collapsible'></li>");
                li.append("<h3>" + item.title + "</h3>");

                var ul = $("<ul data-role='listview'></ul>");
                buildMenu(item.children, ul);

                li.append(ul);
                container.append(li);
            }
            // Normal item
            else {

                var li = $("<li></li>");

                if (item.icon) {
                    li.attr("data-icon", item.icon);
                }

                var link = $("<a></a>")
                    .attr("href", item.url || "#")
                    .attr("data-ajax", "false")
                    .text(item.title);

                li.append(link);
                container.append(li);
            }

        });

    }
    </script>

</head>

<body>

<div data-role="page" id="demoPage">

    <!-- PANEL -->
    <div data-role="panel" id="mainPanel" data-display="overlay">
        <ul id="menuList" data-role="listview" data-inset="false"></ul>
    </div>

    <!-- HEADER -->
    <div data-role="header">
        <a href="#mainPanel" class="ui-btn ui-icon-bars ui-btn-icon-notext">Menu</a>
        <h1>JSON Menu Demo</h1>
    </div>

    <!-- CONTENT -->
    <div role="main" class="ui-content">
        <p>Menu loads dynamically from <strong>/menu.json</strong></p>
    </div>

</div>
<script type="text/javascript" src="/js/mobile/demo.js"></script>
</body>
</html>
