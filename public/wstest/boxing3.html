<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2 Player Boxing - Full Sync</title>
<style>
  body { margin:0; background:#111; color:white; text-align:center; }
  canvas { background:#222; display:block; margin:20px auto; }
</style>
</head>
<body>

<h2>2 Player Boxing - Full Sync</h2>
<canvas id="game" width="900" height="500"></canvas>

<script>
const WS_URL = "wss://webrtc-signaling-server-t3jg.onrender.com"; // 🔁 CHANGE THIS
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let socket;
let currentRoom = prompt("Enter room name:") || "testroom";
let playerRole = null; // 1 or 2
let gameStarted = false;

console.log("Room to join:", currentRoom);

const keys = {};

document.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
document.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

class Player {
  constructor(x, color, facing) {
    this.x = x; this.y = 350; this.width = 80; this.height = 120;
    this.color = color; this.facing = facing;
    this.hp = 100; this.punching = false; this.punchTimer = 0;
  }

  applyInput(input) {
    if (!input) return;
    if (input.left) this.x -= 5;
    if (input.right) this.x += 5;
    if (input.punch && this.punchTimer <= 0) { this.punching = true; this.punchTimer = 20; }
  }

  update() {
    if (this.punchTimer > 0) this.punchTimer--; else this.punching = false;
    this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));
  }

  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);

    if (this.punching) {
      ctx.fillStyle = "yellow";
      if (this.facing === 1) ctx.fillRect(this.x + this.width, this.y + 40, 40, 20);
      else ctx.fillRect(this.x - 40, this.y + 40, 40, 20);
    }
  }

  getHitbox() {
    if (!this.punching) return null;
    if (this.facing === 1) return { x:this.x+this.width, y:this.y+40, width:40, height:20 };
    else return { x:this.x-40, y:this.y+40, width:40, height:20 };
  }
}

const player1 = new Player(150, "red", 1);
const player2 = new Player(650, "blue", -1);

let remoteState = { x:0, y:350, hp:100, punching:false };

function rectCollision(a, b) {
  return a && b && a.x < b.x + b.width &&
         a.x + a.width > b.x &&
         a.y < b.y + b.height &&
         a.y + a.height > b.y;
}

function drawHP() {
  ctx.fillStyle = "green";
  ctx.fillRect(50,50,player1.hp*2,20);
  ctx.fillRect(canvas.width-250,50,player2.hp*2,20);
}

function update() {
  if (!gameStarted) return;

  const localPlayer = playerRole===1?player1:player2;
  const remotePlayer = playerRole===1?player2:player1;

  // Determine input keys based on role
  const localInput = { left:false,right:false,punch:false };
  if (playerRole===1) { localInput.left=keys["a"]; localInput.right=keys["d"]; localInput.punch=keys["w"]; }
  else { localInput.left=keys["j"]; localInput.right=keys["l"]; localInput.punch=keys["i"]; }

  // Apply local input
  localPlayer.applyInput(localInput);
  localPlayer.update();

  // Apply remote state
  remotePlayer.x = remoteState.x;
  remotePlayer.y = remoteState.y;
  remotePlayer.hp = remoteState.hp;
  remotePlayer.punching = remoteState.punching;
  remotePlayer.update();

  // Check hits locally for console (optional)
  const hitboxLocal = localPlayer.getHitbox();
  if (hitboxLocal && rectCollision(hitboxLocal, remotePlayer)) {
    console.log(`You hit opponent! Opponent HP (before server update): ${remotePlayer.hp}`);
  }

  const hitboxRemote = remotePlayer.getHitbox();
  if (hitboxRemote && rectCollision(hitboxRemote, localPlayer)) {
    console.log(`Opponent hit you! Your HP: ${localPlayer.hp}`);
  }

  // Send full state to server
  const state = {
    x: localPlayer.x,
    y: localPlayer.y,
    hp: localPlayer.hp,
    punching: localPlayer.punching
  };
  socket.send(JSON.stringify({ type:"state", room:currentRoom, payload:state }));
  console.log("Sent state:", state);

  if (localPlayer.hp <=0 || remotePlayer.hp <=0) {
    gameStarted=false;
    alert(localPlayer.hp<=0?"You Lose!":"You Win!");
    console.log("Game Over");
  }
}

function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  player1.draw();
  player2.draw();
  drawHP();
}

function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }

function connect() {
  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    console.log("Connected to server");
    socket.send(JSON.stringify({ type:"join", room:currentRoom, payload:null }));
    console.log("Join message sent for room:", currentRoom);
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    //console.log("Received:", data);

    if (data.type==="joined") {
      playerRole = data.payload.role;
      console.log("Assigned role:", playerRole);
    }

    if (data.type==="ready") {
      gameStarted=true;
      console.log("Game Started!");
    }

    if (data.type==="state") {
      // update remote state
      remoteState = data.payload;
      console.log("Remote player state received:", remoteState);
    }

    if (data.type==="error") {
      console.warn("Server error:", data.payload);
    }
  };

  socket.onclose = () => console.log("Disconnected from server");
  socket.onerror = err => console.error("Socket error:", err);
}

connect();
gameLoop();
</script>

</body>
</html>
