<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>2-Person Chat</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; }
    #chat { display: none; margin-top: 20px; }
    #messages { 
      border: 1px solid #ccc; 
      height: 200px; 
      overflow-y: auto; 
      padding: 10px; 
      margin-bottom: 10px;
    }
    button { margin: 5px 0; }
    input { padding: 5px; }
  </style>
</head>
<body>

<h2>Private 2-Person Chat</h2>

<div id="joinSection">
  <input id="roomInput" placeholder="Enter room name" />
  <button id="joinBtn">Join Room</button>
</div>

<div id="chat">
  <p><strong>Room:</strong> <span id="roomDisplay"></span></p>
  <button id="copyBtn">Copy Invite Link</button>

  <div id="messages"></div>

  <input id="messageInput" placeholder="Type message..." />
  <button id="sendBtn">Send</button>
</div>

<script>
const WS_URL = "wss://webrtc-signaling-server-t3jg.onrender.com"; // 🔁 CHANGE THIS

let socket;
let currentRoom = null;

function connectWebSocket(roomToJoin = null) {
  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    console.log("Connected");

    if (roomToJoin) {
      joinRoom(roomToJoin);
    }
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    console.log("Received:", data);

    if (data.type === "error") {
      alert(data.payload);
      return;
    }

    if (data.type === "joined") {
      enterChat(currentRoom);
      return;
    }

    if (data.type === "message") {
      addMessage("Other: " + data.payload);
      return;
    }

    if (data.type === "ready") {
      addMessage("System: Both users connected");
      return;
    }
  };

  socket.onclose = () => {
    addMessage("System: Disconnected");
  };
}

function joinRoom(room) {
  currentRoom = room;

  socket.send(JSON.stringify({
    type: "join",
    room: room,
    payload: null
  }));
}

function enterChat(room) {
  document.getElementById("joinSection").style.display = "none";
  document.getElementById("chat").style.display = "block";
  document.getElementById("roomDisplay").textContent = room;

  const newUrl = `${window.location.origin}${window.location.pathname}?room=${room}`;
  window.history.replaceState({}, "", newUrl);
}

function addMessage(msg) {
  const div = document.createElement("div");
  div.textContent = msg;
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView();
}

// Join button
document.getElementById("joinBtn").onclick = () => {
  const room = document.getElementById("roomInput").value.trim();
  if (!room) return alert("Enter room name");

  connectWebSocket(room);
};

// Send button
document.getElementById("sendBtn").onclick = () => {
  const input = document.getElementById("messageInput");
  const message = input.value.trim();
  if (!message) return;

  socket.send(JSON.stringify({
    type: "message",
    room: currentRoom,
    payload: message
  }));

  addMessage("You: " + message);
  input.value = "";
};

// Copy invite link
document.getElementById("copyBtn").onclick = () => {
  navigator.clipboard.writeText(window.location.href);
  alert("Invite link copied!");
};

// Auto join from URL
window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  const room = params.get("room");

  if (room) {
    connectWebSocket(room);
  }
};
</script>

</body>
</html>
