<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoveNet + Hand Detection Fullscreen</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    canvas {
      display: block;
    }

    video {
      display: none;
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<!-- Pose Detection -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<!-- Hand Detection -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// --------------------
// Detectors
// --------------------
let poseDetector;
let handDetector;

let lastPose = null;
let lastHands = [];

let lastPoseTime = 0;
let lastHandTime = 0;

const DETECTION_INTERVAL = 120;

// --------------------
// Resize canvas
// --------------------
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const width = window.innerWidth;
  const height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// --------------------
// Pose drawing
// --------------------
function drawKeypoints(keypoints) {
  for (const kp of keypoints) {
    if (kp.score > 0.4) {
      ctx.beginPath();
      ctx.arc(kp.x, kp.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = "red";
      ctx.fill();
    }
  }
}

function drawSkeleton(keypoints) {
  const pairs = [
    [5,6],[5,7],[7,9],[6,8],[8,10],
    [5,11],[6,12],[11,12],
    [11,13],[13,15],[12,14],[14,16]
  ];

  ctx.strokeStyle = "lime";
  ctx.lineWidth = 2;

  for (const [i, j] of pairs) {
    const a = keypoints[i];
    const b = keypoints[j];

    if (a && b && a.score > 0.4 && b.score > 0.4) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }
}

// --------------------
// Hand drawing
// --------------------
function drawHands(hands) {
  for (const hand of hands) {
    const keypoints = hand.keypoints;

    // points
    for (const kp of keypoints) {
      ctx.beginPath();
      ctx.arc(kp.x, kp.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = "cyan";
      ctx.fill();
    }

    // fingers
    const fingers = [
      [0,1,2,3,4],
      [0,5,6,7,8],
      [0,9,10,11,12],
      [0,13,14,15,16],
      [0,17,18,19,20]
    ];

    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 2;

    for (const finger of fingers) {
      ctx.beginPath();
      for (let i = 0; i < finger.length; i++) {
        const kp = keypoints[finger[i]];
        if (!kp) continue;

        if (i === 0) ctx.moveTo(kp.x, kp.y);
        else ctx.lineTo(kp.x, kp.y);
      }
      ctx.stroke();
    }
  }
}

// --------------------
// Main loop
// --------------------
async function render() {
  if (video.readyState >= 2) {

    const now = performance.now();

    // ---------------- Pose ----------------
    if (poseDetector && now - lastPoseTime > DETECTION_INTERVAL) {
      const poses = await poseDetector.estimatePoses(video, {
        flipHorizontal: true
      });

      if (poses.length > 0) {
        lastPose = poses[0];
      }

      lastPoseTime = now;
    }

    // ---------------- Hands ----------------
    if (handDetector && now - lastHandTime > DETECTION_INTERVAL) {
      const hands = await handDetector.estimateHands(video, {
        flipHorizontal: true
      });

      lastHands = hands;
      lastHandTime = now;
    }

    const cw = window.innerWidth;
    const ch = window.innerHeight;

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    const vr = vw / vh;
    const cr = cw / ch;

    let drawW, drawH, offsetX, offsetY;

    if (vr > cr) {
      drawH = ch;
      drawW = ch * vr;
      offsetX = (cw - drawW) / 2;
      offsetY = 0;
    } else {
      drawW = cw;
      drawH = cw / vr;
      offsetX = 0;
      offsetY = (ch - drawH) / 2;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // mirror camera
    ctx.save();
    ctx.translate(cw, 0);
    ctx.scale(-1, 1);

    // video
    ctx.drawImage(video, offsetX, offsetY, drawW, drawH);

    // scale correction
    const scaleX = drawW / vw;
    const scaleY = drawH / vh;

    // ---------------- Pose draw ----------------
    if (lastPose) {
      const adjustedPose = lastPose.keypoints.map(kp => ({
        ...kp,
        x: kp.x * scaleX + offsetX,
        y: kp.y * scaleY + offsetY
      }));

      drawKeypoints(adjustedPose);
      drawSkeleton(adjustedPose);
    }

    // ---------------- Hands draw ----------------
    if (lastHands.length > 0) {
      const adjustedHands = lastHands.map(hand => ({
        ...hand,
        keypoints: hand.keypoints.map(kp => ({
          ...kp,
          x: kp.x * scaleX + offsetX,
          y: kp.y * scaleY + offsetY
        }))
      }));

      drawHands(adjustedHands);
    }

    ctx.restore();
  }

  requestAnimationFrame(render);
}

// --------------------
// Camera
// --------------------
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: { ideal: 640 },
      height: { ideal: 480 }
    },
    audio: false
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      video.play();
      resolve();
    };
  });
}

// --------------------
// Init
// --------------------
async function init() {
  resizeCanvas();

  await startCamera();

  await tf.ready();

  // Pose (MoveNet)
  poseDetector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet,
    {
      modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
    }
  );

  // Hands (MediaPipe)
  handDetector = await handPoseDetection.createDetector(
    handPoseDetection.SupportedModels.MediaPipeHands,
    {
      runtime: "mediapipe",
      solutionPath: "https://cdn.jsdelivr.net/npm/@mediapipe/hands",
      modelType: "lite",
      maxHands: 2
    }
  );

  render();
}

// --------------------
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeCanvas, 100);
});

init();
</script>

</body>
</html>
