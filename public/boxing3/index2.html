    originalHeight: 1280,

    idleFrames: 4,    // number of frames in idle animation
    idleSpeed: 200    // ms per frame
  },

    idleFrames: 3,    // number of frames in idle animation
    idleSpeed: 250    // ms per frame
  },
  {
    name: 'Character 3',
    src: 'assets/characters/char3.png', // 384x212
    originalWidth: 384,
    originalHeight: 212,
    frameWidth: 96,   // example: assume 4 columns
    frameHeight: 106, // example: assume 2 rows
    idleFrames: 4,    // number of frames in idle animation
    idleSpeed: 180    // ms per frame
  }
];

// ────────────────────────────────────────────────
// ANIMATION FUNCTION
// ────────────────────────────────────────────────
function animateCharacter(canvasId, char) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.src = char.src;

  let frame = 0;
  let lastTime = 0;

  function drawFrame(timestamp) {
    if (!lastTime) lastTime = timestamp;
    if (timestamp - lastTime >= char.idleSpeed) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Calculate frame position
      const col = frame % (char.originalWidth / char.frameWidth);
      const row = Math.floor(frame / (char.originalWidth / char.frameWidth));
      const sx = col * char.frameWidth;
      const sy = row * char.frameHeight;

      // Scale to fit canvas (this is where you resize)
      const scaleX = canvas.width / char.frameWidth;
      const scaleY = canvas.height / char.frameHeight;
      const drawWidth = char.frameWidth * scaleX;
      const drawHeight = char.frameHeight * scaleY;

      // Center if needed
      const dx = (canvas.width - drawWidth) / 2;
      const dy = (canvas.height - drawHeight) / 2;

      ctx.drawImage(img, sx, sy, char.frameWidth, char.frameHeight, dx, dy, drawWidth, drawHeight);

      frame = (frame + 1) % char.idleFrames;
      lastTime = timestamp;
    }

    requestAnimationFrame(drawFrame);
  }

  img.onload = () => {
    drawFrame(0);
  };
}

// ────────────────────────────────────────────────
// INIT – ANIMATE ALL CHARACTERS
// ────────────────────────────────────────────────
window.addEventListener('load', () => {
  characters.forEach((char, index) => {
    animateCharacter(`char${index+1}-canvas`, char);
  });
});

  // Optional: add a very basic game loop placeholder

    ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

   // updatePose();

    // Update AI if in single-player mode
    updateAI();

    // Draw fighters

    drawFighter(game.opponent, false);

    requestAnimationFrame(gameLoop);
  }

  function updateAI() {
    if (game.mode !== 'ai') return;
  
    const dx = game.me.x - game.opponent.x;
    game.opponent.x += dx > 0 ? 4 : -4;
  
    if (Math.abs(dx) < 150 && Math.random() < 0.04) {
      game.opponent.attacking = true;
      checkHit();
      setTimeout(() => game.opponent.attacking = false, 400);
