<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Boxing Game – Fight Box Enabled</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:sans-serif;
}

#video{
  position:absolute;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  visibility:hidden;
}

#poseCanvas{
  position:absolute;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
}

#recordBtn{
  position:absolute;
  bottom:20px;
  left:20px;
  z-index:300;
  padding:15px 25px;
  font-size:18px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#countdown{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:100px;
  color:white;
  z-index:400;
  display:none;
}

/* ── NEW: Current punch display ────────────────────────────── */
#punchDisplay {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 36px;
  font-weight: bold;
  padding: 12px 28px;
  border-radius: 12px;
  background: rgba(0,0,0,0.6);
  color: #2ecc71;
  text-shadow: 0 0 10px rgba(46,204,113,0.8);
  z-index: 350;
  pointer-events: none;
  min-width: 240px;
  text-align: center;
  transition: all 0.3s ease;
}

#punchDisplay.idle {
  color: #95a5a6;
  background: rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<button id="recordBtn">Record Move</button>
<div id="countdown"></div>
<div id="punchDisplay" class="idle">Idle</div> <!-- NEW: shows current punch -->

<video id="video" autoplay playsinline></video>
<canvas id="poseCanvas"></canvas>

<script>
const video = document.getElementById("video");
const poseCanvas = document.getElementById("poseCanvas");
const ctx = poseCanvas.getContext("2d");
const recordBtn = document.getElementById("recordBtn");
const countdownEl = document.getElementById("countdown");
const punchDisplay = document.getElementById("punchDisplay");

let poseDetector, handDetector;
let isRecording = false;
let recordedFrames = [];

// ── Canvas resize ────────────────────────────────────────
function resizeCanvas(){
  poseCanvas.width = window.innerWidth;
  poseCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);

// ── Camera setup ─────────────────────────────────────────
async function setupCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {width:640, height:480},
    audio: false
  });
  video.srcObject = stream;
  return new Promise(resolve=>{
    video.onloadedmetadata=()=>{
      video.play();
      resolve();
    }
  });
}

// ── Draw helpers ─────────────────────────────────────────
function drawPoint(x,y,color="red"){
  ctx.beginPath();
  ctx.arc(x,y,6,0,2*Math.PI);
  ctx.fillStyle=color;
  ctx.fill();
}

function drawLine(x1,y1,x2,y2,color="yellow"){
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

const skeletonPairs=[
  [0,1],[1,3],[0,2],[2,4],
  [5,7],[7,9],[6,8],[8,10],
  [5,6],[11,12],[5,11],[6,12],
  [11,13],[13,15],[12,14],[14,16]
];

// ── Countdown ────────────────────────────────────────────
async function startCountdown(seconds=3){
  countdownEl.style.display="block";
  for(let i=seconds;i>0;i--){
    countdownEl.innerText=i;
    await new Promise(r=>setTimeout(r,1000));
  }
  countdownEl.innerText="GO!";
  await new Promise(r=>setTimeout(r,700));
  countdownEl.style.display="none";
}

// ── Record button ────────────────────────────────────────
recordBtn.onclick = async ()=>{
  if(isRecording) return;

  recordedFrames=[];
  await startCountdown(3);
  isRecording=true;

  setTimeout(()=>{
    isRecording=false;

    const blob=new Blob([JSON.stringify(recordedFrames)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="moveData.json";
    a.click();

  },3000);
};

// ── Simple punch detection logic ─────────────────────────
function detectPunch(keypoints, hands) {
  if (!keypoints || keypoints.length < 17) return "Idle";

  const leftWrist  = keypoints.find(k => k.name === "left_wrist");
  const rightWrist = keypoints.find(k => k.name === "right_wrist");
  const leftShoulder = keypoints.find(k => k.name === "left_shoulder");
  const rightShoulder = keypoints.find(k => k.name === "right_shoulder");
  const nose = keypoints.find(k => k.name === "nose");

  if (!leftWrist || !rightWrist || !nose) return "Idle";

  const lwY = leftWrist.y;
  const rwY = rightWrist.y;
  const noseY = nose.y;

  // Very basic rules (you can make this much smarter later)
  if (rwY < noseY - 80 && Math.abs(rightWrist.x - nose.x) < 100) {
    return "Uppercut";      // fist high above head
  }
  if (lwY < noseY - 40 && leftWrist.x < nose.x - 50) {
    return "Jab";           // left hand forward quickly
  }
  if (Math.abs(lwY - rwY) < 40 && (lwY < noseY - 30 || rwY < noseY - 30)) {
    return "Hook";          // both fists high and close
  }
  if (leftWrist.y > leftShoulder.y + 50 && rightWrist.y > rightShoulder.y + 50) {
    return "Block";         // both hands up near face/chest
  }

  return "Idle";
}

// ── Main detection loop ──────────────────────────────────
async function detect(){
  ctx.clearRect(0,0,poseCanvas.width,poseCanvas.height);

  ctx.save();
  ctx.scale(-1,1);
  ctx.drawImage(video,-poseCanvas.width,0,poseCanvas.width,poseCanvas.height);
  ctx.restore();

  const scaleX = poseCanvas.width / video.videoWidth;
  const scaleY = poseCanvas.height / video.videoHeight;

  const toCanvas = (x,y) => ({
    x: poseCanvas.width - x * scaleX,
    y: y * scaleY
  });

  const poses = await poseDetector.estimatePoses(video);
  const hands = await handDetector.estimateHands(video,{flipHorizontal:false});

  let currentPunch = "Idle";

  if(poses.length > 0){
    const keypoints = poses[0].keypoints.map(k => {
      const p = toCanvas(k.x, k.y);
      return {...p, score: k.score, name: k.name || k.part};
    });

    // NEW: detect current punch and show it
    currentPunch = detectPunch(keypoints, hands);
    punchDisplay.innerText = currentPunch;
    punchDisplay.className = currentPunch === "Idle" ? "idle" : "";

    // Draw skeleton
    skeletonPairs.forEach(([i,j])=>{
      if(keypoints[i]?.score > 0.5 && keypoints[j]?.score > 0.5)
        drawLine(keypoints[i].x, keypoints[i].y, keypoints[j].x, keypoints[j].y, "yellow");
    });

    keypoints.forEach(k=>{
      if(k.score > 0.5) drawPoint(k.x, k.y, "yellow");
    });
  }

  // Draw hands
  hands.forEach(hand=>{
    const color = hand.handedness === "Right" ? "lime" : "cyan";
    hand.keypoints.forEach(k=>{
      const p = toCanvas(k.x, k.y);
      drawPoint(p.x, p.y, color);
    });
  });

  // Record if active
  if(isRecording){
    recordedFrames.push({
      timestamp: Date.now(),
      pose: poses.length > 0 ? poses[0].keypoints : null,
      hands: hands,
      detectedPunch: currentPunch  // also save what we think it is
    });
  }

  requestAnimationFrame(detect);
}

// ── Start ────────────────────────────────────────────────
async function main(){
  await tf.setBackend("webgl");
  await tf.ready();
  resizeCanvas();
  await setupCamera();

  poseDetector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet,
    {modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING}
  );

  handDetector = await handPoseDetection.createDetector(
    handPoseDetection.SupportedModels.MediaPipeHands,
    {
      runtime: "mediapipe",
      modelType: "full",
      solutionPath: "https://cdn.jsdelivr.net/npm/@mediapipe/hands"
    }
  );

  detect();
}

main();
</script>

</body>
</html>
