<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking | Real-Time Gesture Recognition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="site-data/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="site-data/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="site-data/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="site-data/favicon-16x16.png">
    <link rel="manifest" href="site-data/site.webmanifest">
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <i class="fas fa-hand-paper"></i> Hand Tracking
        </h1>
        <p class="subtitle">Real-time gesture recognition with finger counting</p>
      </header>
      <div class="video-container">
        <div class="video-overlay" id="videoOverlay">
          <div class="overlay-content">
            <i class="fas fa-hand-pointer"></i>
            <p>Click "Start Tracking" to begin</p>
          </div>
        </div>
        <video class="input_video"></video>
        <canvas class="output_canvas" width="1280px" height="720px"></canvas>
      </div>
      <div class="controls">
        <div class="control-group">
          <button id="startButton" class="btn-primary">
            <i class="fas fa-play"></i> Start Tracking </button>
          <button id="stopButton" class="btn-secondary" disabled>
            <i class="fas fa-stop"></i> Stop Tracking </button>
        </div>
        <div class="control-group">
          <label for="cameraSelect">
            <i class="fas fa-camera"></i> Camera </label>
          <select id="cameraSelect">
            <option value="">Select Camera</option>
          </select>
        </div>
      </div>
      <div class="status-bar" id="statusBar">
        <div class="status-message">
          <i class="fas fa-info-circle"></i> Ready to start tracking
        </div>
      </div>
      <div class="data-display">
        <div class="data-panel card">
          <h2>
            <i class="fas fa-hand-paper"></i> Hand Data
          </h2>
          <div class="panel-content">
            <div id="handData" class="data-output">No hand data available</div>
          </div>
        </div>
        <div class="finger-count card">
          <h2>
            <i class="fas fa-fingerprint"></i> Finger Count
          </h2>
          <div class="panel-content">
            <div id="fingerCount" class="big-number">0</div>
            <div class="finger-visualization" id="fingerVisualization">
              <div class="finger" data-finger="thumb"></div>
              <div class="finger" data-finger="index"></div>
              <div class="finger" data-finger="middle"></div>
              <div class="finger" data-finger="ring"></div>
              <div class="finger" data-finger="pinky"></div>
            </div>
          </div>
        </div>
        <div class="gesture-recognition card">
          <h2>
            <i class="fas fa-gesture"></i> Gestures
          </h2>
          <div class="panel-content">
            <div id="gestures" class="data-output">No gestures detected</div>
            <div class="gesture-preview" id="gesturePreview">
              <i class="far fa-question-circle"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  </body>
</html>
